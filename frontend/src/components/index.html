<!DOCTYPE html>
<html>
<head>
  <title>Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    button {
      padding: 10px 20px;
      background-color: blue;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: darkblue;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Hello Website</h1>
    <button>Click Me</button>
  </div>
</body>
</html>
